[build]
  command   = "npm ci --include=dev && npm run build:prod"
  publish   = "_site"
  base      = "."

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV     = "production"

[[redirects]]
  from   = "/"
  to     = "/en/"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    # CSP is set dynamically by the csp-nonce edge function
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
    Report-To              = '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://koztechie.pp.ua/.netlify/functions/csp-report"}]}'
    NEL                    = '{"report_to":"csp-endpoint","max_age":2592000}'

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[edge_functions]]
  function = "csp-nonce"
  path     = "/*"
